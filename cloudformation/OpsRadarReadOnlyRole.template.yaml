AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OpsRadar Read-Only Monitoring Role.
  Creates an IAM Role that allows OpsRadar monitoring to read EC2 instances,
  CloudWatch metrics, CloudWatch alarms, and AWS Cost Explorer data
  with strict least-privilege read-only permissions and an ExternalId condition.

Parameters:
  ExternalId:
    Type: String
    Description: Unique External ID provided in your OpsRadar Mobile app for connection security.
    NoEcho: true
    MinLength: 8
    MaxLength: 128

  RoleName:
    Type: String
    Description: Name of the IAM role to create in your account.
    Default: 'OpsRadarReadOnlyRole'

Resources:
  OpsRadarMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only monitoring role assumed by OpsRadar Mobile
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess'
      Policies:
        - PolicyName: OpsRadarCostExplorerReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostForecast'
                  - 'ce:GetDimensionValues'
                Resource: '*'

Outputs:
  RoleArn:
    Description: Enter this Role ARN into your OpsRadar Mobile App to complete the connection.
    Value: !GetAtt OpsRadarMonitoringRole.Arn
    Export:
      Name: OpsRadarMonitoringRoleArn
